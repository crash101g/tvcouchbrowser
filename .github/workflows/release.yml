name: release

# On a v* tag: build, sign with the release key from repository secrets, and publish a full
# (non-pre) release with the APK and its .sha256, named so install-tv-apps.sh picks it up.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install SDK platform
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TVCB_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          TVCB_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          TVCB_KEYSTORE_PASSWORD: ${{ secrets.TVCB_KEYSTORE_PASSWORD }}
          TVCB_KEY_ALIAS: ${{ secrets.TVCB_KEY_ALIAS }}
          TVCB_KEY_PASSWORD: ${{ secrets.TVCB_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name, checksum and verify the signature
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="tvcouchbrowser-${VERSION}-universal.apk"
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$NAME"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "dist/$NAME" | grep -q "CN=TVCouchBrowser"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          cat "dist/$NAME.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "TVCouchBrowser ${GITHUB_REF_NAME#v}" --generate-notes --latest
